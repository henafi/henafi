<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b400ff"/>
      <stop offset="50%" stop-color="#0aa344"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: 'Orbitron';
        font-weight: 700;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .title {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 42px;
        fill: #FFD700;
        animation: twinkling 2s ease-in-out infinite;
      }
      @keyframes twinkling {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="url(#aurora)"/>
  <path d="M0,150 C200,190 350,120 600,140 C850,160 1000,110 1200,150 L1200,200 L0,200 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M0,165 C250,130 450,185 700,155 C900,130 1050,175 1200,150 L1200,200 L0,200 Z" fill="#ffffff" opacity="0.10"/>

  <text x="600" y="90" text-anchor="middle" class="title">Hi, I'm Henrik</text>
</svg>
